[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insight-llm"
version = "0.0.0"
description = "Deterministic data/experiment scaffolding for insight-llm."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/insight_llm"]
